<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>ポートフォリオ</title>
     <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <!-- ヘッダー：名前と肩書き -->
    <header>
      <h1>あなたの名前</h1>
      <p>演劇 · ワークショップ · 居場所づくり</p>
    </header>

    <!-- 作品一覧 -->
    <main>

      <!-- 作品カード 1枚目 -->
      <div class="card">
        <img src="images/utibenkei_3rd_1.png" alt="内弁慶の立往生の３回めの本公演フライヤー">
        <h2>作品タイトル</h2> 
        <p class="year">2024年</p>
        <p class="desc">作品の説明をここに書きます。</p>
      </div>

      <!-- 作品カード 2枚目 -->
      <div class="card">
        <img src="images/IMG_4425.JPG" alt="舞台照明を真正面から撮影">
        <h2>作品タイトル</h2>
        <p class="year">2023年</p>
        <p class="desc">作品の説明をここに書きます。</p>
      </div>

      <!-- 作品カード 3枚目 -->
      <div class="card">
       <img src="images/IMG_1355.JPG" alt="伯母の家の猫 鍵尻尾">
       <h2>作品タイトル</h2>   
       <p class="year">2024年</p>
       <p class="desc">作品の説明をここに書きます。</p>
      </div>

    </main>


    <script src="script.js"></script>

  </body>
</html>
